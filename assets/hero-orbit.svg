<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-label="Animated 3D orbit of cloud technologies and a CI/CD pipeline">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#111a33"/>
    </linearGradient>
    <radialGradient id="core" cx="50%" cy="40%" r="60%">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#2563eb"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1e2a4a" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="900" height="320" rx="18" fill="url(#bg)"/>
  <rect width="900" height="320" rx="18" fill="url(#grid)" opacity="0.5"/>

  <!-- ORBIT SYSTEM -->
  <g transform="translate(230,165)">
    <g transform="rotate(-22)">
      <ellipse rx="125" ry="42" fill="none" stroke="#38bdf8" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 6"/>
      <circle r="8" fill="#38bdf8" filter="url(#glow)">
        <animateMotion dur="9s" repeatCount="indefinite" path="M-125,0 a125,42 0 1,0 250,0 a125,42 0 1,0 -250,0"/>
      </circle>
      <circle r="5" fill="#34d399" filter="url(#glow)">
        <animateMotion dur="9s" begin="-4.5s" repeatCount="indefinite" path="M-125,0 a125,42 0 1,0 250,0 a125,42 0 1,0 -250,0"/>
      </circle>
    </g>
    <g transform="rotate(38)">
      <ellipse rx="110" ry="36" fill="none" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 6"/>
      <circle r="7" fill="#a78bfa" filter="url(#glow)">
        <animateMotion dur="7s" repeatCount="indefinite" path="M-110,0 a110,36 0 1,1 220,0 a110,36 0 1,1 -220,0"/>
      </circle>
    </g>
    <g transform="rotate(95)">
      <ellipse rx="95" ry="30" fill="none" stroke="#fb923c" stroke-opacity="0.45" stroke-width="1.4" stroke-dasharray="4 6"/>
      <circle r="6" fill="#fb923c" filter="url(#glow)">
        <animateMotion dur="11s" repeatCount="indefinite" path="M-95,0 a95,30 0 1,0 190,0 a95,30 0 1,0 -190,0"/>
      </circle>
      <circle r="4" fill="#f472b6" filter="url(#glow)">
        <animateMotion dur="11s" begin="-5s" repeatCount="indefinite" path="M-95,0 a95,30 0 1,0 190,0 a95,30 0 1,0 -190,0"/>
      </circle>
    </g>
    <!-- core -->
    <circle r="40" fill="#38bdf8" opacity="0.12">
      <animate attributeName="r" values="40;52;40" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.18;0.04;0.18" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="32" fill="url(#core)" filter="url(#glow)"/>
    <text y="5" text-anchor="middle" font-family="'Courier New',monospace" font-size="13" font-weight="700" fill="#fff">DevOps</text>
  </g>

  <!-- PIPELINE -->
  <text x="470" y="52" font-family="'Courier New',monospace" font-size="15" fill="#64748b">$ git push origin main</text>
  <text x="470" y="74" font-family="'Courier New',monospace" font-size="15" fill="#38bdf8">
    ▸ pipeline running
    <animate attributeName="opacity" values="1;0.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <line x1="525" y1="170" x2="835" y2="170" stroke="#334155" stroke-width="2" stroke-dasharray="3 5"/>
  <circle r="6" cy="170" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="525;835" dur="4s" repeatCount="indefinite"/>
  </circle>

  <!-- cube: Build -->
  <g transform="translate(525,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="0s" repeatCount="indefinite"/>
      <polygon points="0,-26 22,-14 0,-2 -22,-14" fill="#7dd3fc"/>
      <polygon points="-22,-14 0,-2 0,24 -22,12" fill="#0ea5e9"/>
      <polygon points="0,-2 22,-14 22,12 0,24" fill="#0369a1"/>
    </g>
  </g>
  <!-- cube: Scan -->
  <g transform="translate(628,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="0.4s" repeatCount="indefinite"/>
      <polygon points="0,-26 22,-14 0,-2 -22,-14" fill="#c4b5fd"/>
      <polygon points="-22,-14 0,-2 0,24 -22,12" fill="#8b5cf6"/>
      <polygon points="0,-2 22,-14 22,12 0,24" fill="#5b21b6"/>
    </g>
  </g>
  <!-- cube: Test -->
  <g transform="translate(731,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="0.8s" repeatCount="indefinite"/>
      <polygon points="0,-26 22,-14 0,-2 -22,-14" fill="#fdba74"/>
      <polygon points="-22,-14 0,-2 0,24 -22,12" fill="#f97316"/>
      <polygon points="0,-2 22,-14 22,12 0,24" fill="#9a3412"/>
    </g>
  </g>
  <!-- cube: Deploy -->
  <g transform="translate(834,150)">
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      <polygon points="0,-26 22,-14 0,-2 -22,-14" fill="#6ee7b7"/>
      <polygon points="-22,-14 0,-2 0,24 -22,12" fill="#10b981"/>
      <polygon points="0,-2 22,-14 22,12 0,24" fill="#047857"/>
    </g>
  </g>

  <g font-family="'Courier New',monospace" font-size="13" text-anchor="middle" fill="#cbd5e1">
    <text x="525" y="222">build</text>
    <text x="628" y="222">scan</text>
    <text x="731" y="222">test</text>
    <text x="834" y="222">deploy</text>
  </g>

  <text x="470" y="282" font-family="'Courier New',monospace" font-size="13" fill="#64748b">AWS · Kubernetes · Terraform · DevSecOps · SRE</text>
</svg>
